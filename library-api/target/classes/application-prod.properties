# Configurações específicas para ambiente de produção

# APIs do Ecossistema LLAM (Kubernetes - produção)
llam.api.class.url=http://api-class-backend-prd.producao-llam.svc.cluster.local:8080
llam.api.dublincore.url=http://api-dublin-core-backend-prd.producao-llam.svc.cluster.local:8080
llam.api.person.url=http://api-person-backend-prd.producao-llam.svc.cluster.local:8080
llam.api.organizationunit.url=http://api-organization-unit-backend-prd.producao-llam.svc.cluster.local:8080
llam.api.transaction.url=http://api-transaction-backend-prd.producao-llam.svc.cluster.local:8080

# Timeout para chamadas REST (ms)
llam.api.timeout.connect=5000
llam.api.timeout.read=30000

# Logging
logging.level.br.tec.llam=WARN
logging.level.org.springframework.web.client=ERROR

# Desabilita informações detalhadas de erro em produção
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never
server.error.include-exception=false
