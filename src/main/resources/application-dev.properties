# ============================================
# BIBLIO-API - CONFIGURACOES DE DESENVOLVIMENTO
# ============================================
# Este arquivo contem configuracoes para ambiente de desenvolvimento.
# Valores fixos para facilitar testes locais.

# ============================================
# BANCO DE DADOS H2 (em memoria)
# ============================================
spring.datasource.url=jdbc:h2:mem:bibliodb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console habilitado para desenvolvimento
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA - Desenvolvimento
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# Inicializacao de dados de teste
spring.sql.init.mode=always
spring.jpa.defer-datasource-initialization=true

# ============================================
# JWT - DESENVOLVIMENTO
# ============================================
# ATENCAO: Chaves fixas apenas para desenvolvimento!
jwt.secret=BiblioApiSecretKey2024CapgeminiDesafioTecnicoJWTSecure256Bits!
jwt.expiration=900000
jwt.refresh-expiration-days=7

# ============================================
# CRIPTOGRAFIA AES - DESENVOLVIMENTO
# ============================================
# ATENCAO: Chave fixa apenas para desenvolvimento!
crypto.aes.key=BiblioApiAES256KeyForDevelopment!

# ============================================
# LOGGING - DESENVOLVIMENTO
# ============================================
logging.level.root=INFO
logging.level.com.capgemini.biblioapi=DEBUG
logging.level.org.springframework.security=DEBUG
