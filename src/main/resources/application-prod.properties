# ============================================
# BIBLIO-API - CONFIGURACOES DE PRODUCAO
# ============================================
# Este arquivo contem configuracoes para ambiente de producao.
# Valores sensiveis devem ser fornecidos via variaveis de ambiente.

# ============================================
# SERVIDOR
# ============================================
server.port=${SERVER_PORT:8080}

# HTTPS (obrigatorio em producao)
# server.ssl.enabled=true
# server.ssl.key-store=${SSL_KEYSTORE_PATH}
# server.ssl.key-store-password=${SSL_KEYSTORE_PASSWORD}
# server.ssl.key-store-type=PKCS12

# ============================================
# BANCO DE DADOS (PostgreSQL recomendado)
# ============================================
# Em producao, usar banco de dados real (PostgreSQL, MySQL, etc)
# spring.datasource.url=${DATABASE_URL}
# spring.datasource.username=${DATABASE_USERNAME}
# spring.datasource.password=${DATABASE_PASSWORD}
# spring.datasource.driver-class-name=org.postgresql.Driver

# H2 desabilitado em producao
spring.h2.console.enabled=false

# JPA - Producao
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ============================================
# JWT - SEGURANCA
# ============================================
# IMPORTANTE: Em producao, usar variaveis de ambiente
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:900000}
jwt.refresh-expiration-days=${JWT_REFRESH_EXPIRATION_DAYS:7}

# ============================================
# CRIPTOGRAFIA AES
# ============================================
# IMPORTANTE: Em producao, usar variavel de ambiente
crypto.aes.key=${CRYPTO_AES_KEY}

# ============================================
# LOGGING - PRODUCAO
# ============================================
logging.level.root=WARN
logging.level.com.capgemini.biblioapi=INFO
logging.level.org.springframework.security=WARN

# Logs de auditoria de seguranca
logging.level.com.capgemini.biblioapi.config.JwtAuthenticationFilter=INFO
logging.level.com.capgemini.biblioapi.controller.AuthController=INFO

# ============================================
# SEGURANCA ADICIONAL
# ============================================
# Headers de seguranca (configurados no SecurityConfig)
# - Content-Security-Policy
# - X-Content-Type-Options
# - X-Frame-Options
# - X-XSS-Protection

