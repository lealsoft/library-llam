# ============================================
# BIBLIO-API - CONFIGURACOES BASE
# ============================================
# Este arquivo contem configuracoes comuns a todos os ambientes.
# Configuracoes especificas estao em:
#   - application-dev.properties  (desenvolvimento)
#   - application-prod.properties (producao)

# ============================================
# PROFILE ATIVO
# ============================================
# Altere para 'prod' em producao ou via variavel de ambiente:
# java -jar biblio-api.jar --spring.profiles.active=prod
spring.profiles.active=${SPRING_PROFILES_ACTIVE:dev}

# ============================================
# SERVIDOR
# ============================================
server.port=${SERVER_PORT:8080}

# ============================================
# APLICACAO
# ============================================
spring.application.name=biblio-api
