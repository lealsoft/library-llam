# Configurações específicas para ambiente de desenvolvimento

# APIs do Ecossistema LLAM (desenvolvimento local)
# Portas conforme configuração dos backends Ecos
llam.api.class.url=https://api-class-backend-hom.llam.tec.br
llam.api.dublincore.url=https://api-dublin-core-backend-hom.llam.tec.br
llam.api.person.url=https://api-person-backend-hom.llam.tec.br
llam.api.organizationunit.url=http://api-organization-unit-backend-hom.llam.tec.br
llam.api.transaction.url=https://api-transaction-backend-hom.llam.tec.br

# Timeout para chamadas REST (ms)
llam.api.timeout.connect=5000
llam.api.timeout.read=30000

# Logging mais verboso para desenvolvimento
logging.level.br.tec.llam=DEBUG
logging.level.org.springframework.web.client=DEBUG

# Habilita informações detalhadas de erro
server.error.include-message=always
server.error.include-binding-errors=always
server.error.include-stacktrace=always
server.error.include-exception=true
