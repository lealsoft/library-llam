# Configurações específicas para ambiente de homologação

# APIs do Ecossistema LLAM (Kubernetes - homologação)
llam.api.class.url=https://api-class-backend-hom.llam.tec.br
llam.api.dublincore.url=https://api-dublin-core-backend-hom.llam.tec.br
llam.api.person.url=https://api-person-backend-hom.llam.tec.br
llam.api.organizationunit.url=http://api-organization-unit-backend-hom.llam.tec.br
llam.api.transaction.url=https://api-transaction-backend-hom.llam.tec.br

# Timeout para chamadas REST (ms)
llam.api.timeout.connect=5000
llam.api.timeout.read=30000

# Logging
logging.level.br.tec.llam=INFO
logging.level.org.springframework.web.client=WARN
